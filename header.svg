<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f7ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="900" height="200" rx="14" fill="url(#bg)"/>

  <!-- floating circles -->
  <circle cx="120" cy="60" r="40" fill="#00f7ff" opacity="0.12">
    <animate attributeName="cy" values="60;90;60" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="140" r="55" fill="#a78bfa" opacity="0.12">
    <animate attributeName="cy" values="140;110;140" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="40" r="25" fill="#00f7ff" opacity="0.10">
    <animate attributeName="cx" values="650;700;650" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- name -->
  <text x="450" y="95" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="52" font-weight="bold" fill="url(#txt)">
    Natarajansri S
    <animate attributeName="opacity" from="0" to="1" dur="1.5s" fill="freeze"/>
  </text>

  <!-- subtitle -->
  <text x="450" y="140" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="20" fill="#ffffff" opacity="0">
    Software &amp; IoT Enthusiast
    <animate attributeName="opacity" from="0" to="0.9" begin="1s" dur="1.5s" fill="freeze"/>
  </text>
</svg>
